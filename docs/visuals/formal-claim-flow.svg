<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">4Leibniz formal claim flow</title><desc id="desc">An editable diagram showing Lean source, pinned build, formal claim export, and read-only web and mobile consumers.</desc><rect width="1600" height="900" fill="#07111f"/><g font-family="ui-sans-serif,system-ui,sans-serif"><text x="100" y="100" fill="#e7f0fa" font-size="38" font-weight="700">4LEIBNIZ • FORMAL CLAIM FLOW</text><text x="100" y="140" fill="#91a9c2" font-size="20">The proof source produces claim metadata; consumer interfaces do not invent theorem status.</text></g><g stroke="#42c9d7" stroke-width="3"><rect x="120" y="295" width="270" height="180" rx="22" fill="#0b2130"/><rect x="485" y="295" width="270" height="180" rx="22" fill="#12213e" stroke="#8996ff"/><rect x="850" y="295" width="270" height="180" rx="22" fill="#211c3e" stroke="#b77bff"/><rect x="1215" y="230" width="265" height="120" rx="22" fill="#173226" stroke="#60d394"/><rect x="1215" y="420" width="265" height="120" rx="22" fill="#302417" stroke="#f2b84b"/></g><g fill="none" stroke="#f2c14e" stroke-width="5"><path d="M390 385H485"/><path d="M755 385H850"/><path d="M1120 385H1180V290H1215"/><path d="M1120 385H1180V480H1215"/></g><g fill="#f2c14e"><polygon points="485,385 455,367 455,403"/><polygon points="850,385 820,367 820,403"/><polygon points="1215,290 1185,272 1185,308"/><polygon points="1215,480 1185,462 1185,498"/></g><g font-family="ui-sans-serif,system-ui,sans-serif" fill="#eef7ff" text-anchor="middle"><text x="255" y="365" font-size="26" font-weight="700">LEAN MODULES</text><text x="255" y="405" font-size="18" fill="#a9c6d5">declarations</text><text x="620" y="365" font-size="26" font-weight="700">PINNED CHECK</text><text x="620" y="405" font-size="18" fill="#bbc5ff">toolchain + imports</text><text x="985" y="365" font-size="26" font-weight="700">CLAIM EXPORT</text><text x="985" y="405" font-size="18" fill="#d8baff">status + commit provenance</text><text x="1348" y="282" font-size="23" font-weight="700">WEB ARCHIVE</text><text x="1348" y="318" font-size="17" fill="#a8e9c2">read-only display</text><text x="1348" y="472" font-size="23" font-weight="700">MOBILE ORACLE</text><text x="1348" y="508" font-size="17" fill="#ffd68c">guided explanation</text></g><rect x="260" y="650" width="1080" height="92" rx="18" fill="#102030" stroke="#29435e" stroke-width="2"/><text x="800" y="707" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" fill="#d4e3f2" font-size="22">Only a successful pinned Lean check may support <tspan fill="#60d394" font-weight="700">proved</tspan>. Retrieval and explanation never upgrade the status.</text></svg>