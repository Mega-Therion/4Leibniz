name: Calculemus Verification
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
      - name: Fetch pre-built Mathlib binaries
        run: lake exe cache get
      - name: Build Lean library
        run: lake build
      - name: Reject sorry placeholders
        run: python3 scripts/check_sorries.py
      - name: Generate proof receipt
        run: python3 scripts/proof_receipt.py
      - uses: actions/upload-artifact@v4
        with:
          name: proof-receipt
          path: proof-receipt.json

  machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ZK circuit tooling (so npx resolves snarkjs from node_modules, not the network)
        run: npm --prefix circuits ci
      - name: Run the Calculemus machine (dry-run; kernel check happens in the lean job)
        run: |
          python3 calculemus.py examples/*.uc --dry-run --registry /tmp/ci-ledger.jsonl
          python3 - <<'PY'
          import json
          verdicts = [json.loads(l)["verdict"] for l in open("/tmp/ci-ledger.jsonl")]
          assert "kernel-proven" not in verdicts, "dry-run must never claim kernel-proven"
          print("ledger verdicts:", verdicts)
          PY
      - name: Full Python test suite (B-07 -- previously only two files ran in CI)
        run: |
          pip install flask websockets cryptography pytest
          # Pillow: tests/test_htr_provenance.py exercises htr/ line-crop handling.
          pip install pillow
          LEIBNIZ_API_TOKEN=ci-test-token python3 -m pytest tests/ -q
      - name: Dependency audit (B-13/security lane)
        run: |
          pip install pip-audit
          pip-audit -r <(pip freeze) --skip-editable || echo "pip-audit found findings; see log above (not yet a blocking gate)"

  docs:
    # Disabled 2026-09-06: leanprover-community/docgen-action's project-metadata
    # step hard-requires lakefile.toml ("Could not find `lakefile.toml`") and has
    # no lakefile.lean fallback. This project's real Lake config is lakefile.lean
    # (the `lean` job builds from it successfully) -- migrating the build format
    # just to satisfy a docs-preview job that doesn't even publish anything
    # (build-page: false, deploy: false) is not worth the risk. Re-enable once
    # docgen-action supports lakefile.lean, or if this project moves to
    # lakefile.toml for its own reasons.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Fetch pre-built Mathlib binaries
        run: lake exe cache get
      - name: Build API documentation with doc-gen4
        uses: leanprover-community/docgen-action@main
        with:
          api-docs: true
          build-page: false
          deploy: false

  independent-kernel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Fetch Lean-for-Lean external checker
        run: git clone --depth 1 https://github.com/digama0/lean4lean.git /tmp/lean4lean
      - name: Build external checker
        working-directory: /tmp/lean4lean
        run: lake build lean4lean
      - name: Check the project artifact graph
        run: lake env /tmp/lean4lean/.lake/build/bin/lean4lean Leibniz
