<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4Leibniz — Calculemus</title>
<style>body{font:16px system-ui;margin:0;background:#10141c;color:#eef2f7}main{max-width:1050px;margin:auto;padding:32px}h1{color:#d9b36c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#1b2330;border:1px solid #364255;border-radius:10px;padding:18px;cursor:pointer}.card:hover{border-color:#d9b36c}.status{font-size:.8em;text-transform:uppercase;color:#9dd7b2}.details{display:none;margin-top:12px;color:#b8c2d0}.panel{margin-top:24px;background:#171e29;padding:18px;border-radius:10px}button{background:#d9b36c;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}input{background:#0d1219;color:white;border:1px solid #475569;padding:9px;border-radius:5px;margin:4px}</style></head>
<body><main><h1>4Leibniz / Calculemus</h1><p>Kernel-oriented formal knowledge graph, ordered by the eight-pillar architecture.</p><section id="modules" class="grid"></section><section class="panel"><h2>Dispute-resolution oracle</h2><input id="left" placeholder="Left proposition" value="claim A"><input id="right" placeholder="Right proposition" value="claim B"><button onclick="adjudicate()">Adjudicate</button><pre id="verdict"></pre></section><section class="panel"><h2>Build status</h2><button onclick="build()">Run lake build</button><pre id="build"></pre></section></main>
<script>
const api=(path,opt)=>fetch(path,opt).then(r=>r.json());
async function load(){const [mods,ths]=await Promise.all([api('/api/modules'),api('/api/theorems')]);document.querySelector('#modules').innerHTML=mods.map(m=>`<article class="card" onclick="this.querySelector('.details').style.display=this.querySelector('.details').style.display==='block'?'none':'block'"><b>${m.order}. ${m.name}</b><div>${m.pillar}</div><span class="status">${m.status}</span><div class="details">${ths.filter(t=>t.module===m.name).map(t=>`<p><b>${t.name}</b><br>Status: ${t.status}<br>Dependencies: ${t.dependencies.join(', ')||'none'}</p>`).join('')||'<p>No theorem records yet.</p>'}</div></article>`).join('')}
async function adjudicate(){const body={left:{name:document.querySelector('#left').value,value:true},right:{name:document.querySelector('#right').value,value:false}};document.querySelector('#verdict').textContent=JSON.stringify(await api('/api/adjudicate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),null,2)}
async function build(){const out=document.querySelector('#build');out.textContent='Connecting to Calculemus stream…\\n';const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.hostname+':8765');ws.onopen=()=>ws.send(JSON.stringify({action:'build'}));ws.onmessage=e=>{const msg=JSON.parse(e.data);if(msg.event==='log')out.textContent+=msg.line+'\\n';else out.textContent+='\\n'+JSON.stringify(msg,null,2);out.scrollTop=out.scrollHeight};ws.onerror=()=>out.textContent+='WebSocket unavailable; use POST /api/build.\\n'}
load();
</script></body></html>
