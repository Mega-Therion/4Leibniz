<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Scholarly retrieval and citation flow</title><desc id="desc">An editable diagram showing source texts becoming indexed passages, retrieved context, a guided answer, and source citations.</desc><rect width="1600" height="900" fill="#07111f"/><g font-family="ui-sans-serif,system-ui,sans-serif"><text x="100" y="100" fill="#e7f0fa" font-size="38" font-weight="700">4LEIBNIZ WEB • SCHOLARLY RETRIEVAL</text><text x="100" y="140" fill="#91a9c2" font-size="20">Archive text remains distinguishable from retrieval context, explanation, and formal verification.</text></g><g fill="none" stroke="#f2c14e" stroke-width="5"><path d="M385 410H485"/><path d="M755 410H855"/><path d="M1125 410H1225"/></g><g fill="#f2c14e"><polygon points="485,410 455,392 455,428"/><polygon points="855,410 825,392 825,428"/><polygon points="1225,410 1195,392 1195,428"/></g><g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><rect x="115" y="290" width="270" height="240" rx="24" fill="#0b2130" stroke="#42c9d7" stroke-width="3"/><text x="250" y="375" fill="#eef7ff" font-size="26" font-weight="700">SOURCE TEXTS</text><text x="250" y="415" fill="#a9c6d5" font-size="18">transcriptions</text><text x="250" y="445" fill="#a9c6d5" font-size="18">translations</text><text x="250" y="475" fill="#a9c6d5" font-size="18">metadata</text><rect x="485" y="290" width="270" height="240" rx="24" fill="#12213e" stroke="#8996ff" stroke-width="3"/><text x="620" y="375" fill="#eef7ff" font-size="26" font-weight="700">INDEXED PASSAGES</text><text x="620" y="420" fill="#bbc5ff" font-size="18">bounded chunks</text><text x="620" y="450" fill="#bbc5ff" font-size="18">provenance preserved</text><rect x="855" y="290" width="270" height="240" rx="24" fill="#211c3e" stroke="#b77bff" stroke-width="3"/><text x="990" y="375" fill="#eef7ff" font-size="26" font-weight="700">GUIDED ANSWER</text><text x="990" y="420" fill="#d8baff" font-size="18">explanation</text><text x="990" y="450" fill="#d8baff" font-size="18">not a proof claim</text><rect x="1225" y="290" width="270" height="240" rx="24" fill="#173226" stroke="#60d394" stroke-width="3"/><text x="1360" y="375" fill="#eef7ff" font-size="26" font-weight="700">CITATIONS</text><text x="1360" y="420" fill="#a8e9c2" font-size="18">source paths</text><text x="1360" y="450" fill="#a8e9c2" font-size="18">claim status</text></g><rect x="250" y="675" width="1100" height="84" rx="18" fill="#102030" stroke="#29435e" stroke-width="2"/><text x="800" y="728" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" fill="#d4e3f2" font-size="22">A retrieved passage supports an explanation; a <tspan fill="#60d394" font-weight="700">formal claim</tspan> requires its own pinned verification record.</text></svg>