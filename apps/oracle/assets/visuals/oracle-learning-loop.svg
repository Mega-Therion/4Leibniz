<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Leibniz Oracle learning loop</title><desc id="desc">An editable mobile-oriented loop between Guide, Learn, Lab, and Saved, grounded by source citations and formal claim status.</desc><rect width="1200" height="1200" fill="#07111f"/><g font-family="ui-sans-serif,system-ui,sans-serif"><text x="100" y="110" fill="#e7f0fa" font-size="42" font-weight="700">LEIBNIZ ORACLE</text><text x="100" y="152" fill="#91a9c2" font-size="22">A learning loop grounded in sources and formal claim status</text></g><g fill="none" stroke="#f2c14e" stroke-width="6"><path d="M600 350C850 350 950 500 850 600"/><path d="M850 600C850 850 700 950 600 850"/><path d="M600 850C350 850 250 700 350 600"/><path d="M350 600C350 350 500 250 600 350"/></g><g fill="#f2c14e"><polygon points="850,600 816,578 820,620"/><polygon points="600,850 622,816 580,820"/><polygon points="350,600 384,622 380,580"/><polygon points="600,350 578,384 620,380"/></g><g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><rect x="450" y="250" width="300" height="155" rx="26" fill="#0b2130" stroke="#42c9d7" stroke-width="3"/><text x="600" y="325" fill="#eef7ff" font-size="30" font-weight="700">GUIDE</text><text x="600" y="365" fill="#a9c6d5" font-size="18">context and sources</text><rect x="795" y="522" width="250" height="155" rx="26" fill="#12213e" stroke="#8996ff" stroke-width="3"/><text x="920" y="597" fill="#eef7ff" font-size="30" font-weight="700">LEARN</text><text x="920" y="637" fill="#bbc5ff" font-size="18">structured exploration</text><rect x="450" y="795" width="300" height="155" rx="26" fill="#211c3e" stroke="#b77bff" stroke-width="3"/><text x="600" y="870" fill="#eef7ff" font-size="30" font-weight="700">LAB</text><text x="600" y="910" fill="#d8baff" font-size="18">claim check, not proof</text><rect x="155" y="522" width="250" height="155" rx="26" fill="#173226" stroke="#60d394" stroke-width="3"/><text x="280" y="597" fill="#eef7ff" font-size="30" font-weight="700">SAVED</text><text x="280" y="637" fill="#a8e9c2" font-size="18">return and compare</text></g><circle cx="600" cy="600" r="138" fill="#102030" stroke="#f2b84b" stroke-width="4"/><text x="600" y="586" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" fill="#fff4d1" font-size="25" font-weight="700">PROVENANCE</text><text x="600" y="622" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" fill="#ffd68c" font-size="19">citations</text><text x="600" y="652" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" fill="#ffd68c" font-size="19">claim status</text><text x="100" y="1090" font-family="ui-sans-serif,system-ui,sans-serif" fill="#91a9c2" font-size="18">The Oracle may explain a claim; only its linked formal record may establish whether it is formally verified.</text></svg>